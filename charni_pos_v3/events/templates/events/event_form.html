{% extends "base.html" %}

{% block main %}
  <div class="flex-shrink-0">
    {% block content %}
      <div class="container">
        <form class="pt-3" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </div>
    {% endblock content %}
  </div>
{% endblock main %}
