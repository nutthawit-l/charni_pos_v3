services:
  docs:
    image: charni_pos_v3_local_docs
    container_name: charni_pos_v3_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./charni_pos_v3:/app/charni_pos_v3:z
    ports:
      - '9000:9000'
    command: /start-docs
